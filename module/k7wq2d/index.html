<section class="modulex-ap" aria-label="Araç parkı">
  {{html}}
</section>
<style>
  .modulex-ap {
    --ap-navy: #0a2e5c;
    --ap-navy2: #12407a;
    --ap-amber: #f5a623;
    --ap-ink: #1a1a1a;
    --ap-mute: #5b6472;
    --ap-line: #e3e8f0;
    --ap-soft: #f4f7fb;
    width: var(--max);
    margin: 0 auto;
    padding: 32px 0 48px;
    color: var(--ap-ink);
    box-sizing: border-box;
  }

  .modulex-ap *,
  .modulex-ap *::before,
  .modulex-ap *::after {
    box-sizing: border-box;
  }

  
  .modulex-ap-hero {
    position: relative;
    overflow: hidden;
    padding: 44px 40px 0;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--ap-navy) 0%, var(--ap-navy2) 100%);
    color: #fff;
  }

  .modulex-ap-hero::before {
    content: "";
    position: absolute;
    top: -90px;
    right: -90px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 166, 35, 0.35), rgba(245, 166, 35, 0) 70%);
    pointer-events: none;
  }

  .modulex-ap-eyebrow {
    position: relative;
    display: inline-block;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(245, 166, 35, 0.16);
    color: var(--ap-amber);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .modulex-ap-title {
    position: relative;
    margin: 14px 0 10px;
    color: #fff;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 700;
    line-height: 1.1;
  }

  .modulex-ap-spot {
    position: relative;
    max-width: 700px;
    margin: 0;
    color: rgba(255, 255, 255, 0.88);
    font-size: 17px;
    line-height: 1.65;
  }

  .modulex-ap-stats {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 34px -40px 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(0, 0, 0, 0.16);
  }

  .modulex-ap-stat {
    padding: 20px 24px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
  }

  .modulex-ap-stat:last-child {
    border-right: 0;
  }

  .modulex-ap-statval {
    display: block;
    color: var(--ap-amber);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }

  .modulex-ap-statlabel {
    display: block;
    margin-top: 7px;
    color: rgba(255, 255, 255, 0.78);
    font-size: 13px;
    line-height: 1.35;
  }

  
  .modulex-ap-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 22px 0 4px;
  }

  .modulex-ap-navlink {
    padding: 8px 15px;
    border: 1px solid var(--ap-line);
    border-radius: 99px;
    background: #fff;
    color: var(--ap-navy);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .modulex-ap-navlink:hover {
    border-color: var(--ap-navy);
    background: var(--ap-navy);
    color: #fff;
  }

  
  .modulex-ap-group {
    margin-top: 20px;
    padding: 26px;
    border: 1px solid var(--ap-line);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 2px 10px rgba(10, 46, 92, 0.05);
    scroll-margin-top: 90px;
  }

  .modulex-ap-ghead {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .modulex-ap-no {
    display: grid;
    flex: none;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--ap-navy);
    color: var(--ap-amber);
    font-size: 18px;
    font-weight: 700;
  }

  .modulex-ap-gname {
    margin: 0;
    color: var(--ap-navy);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
  }

  .modulex-ap-gdesc {
    margin: 4px 0 0;
    color: var(--ap-mute);
    font-size: 15px;
    line-height: 1.5;
  }

  .modulex-ap-count {
    flex: none;
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 99px;
    background: var(--ap-soft);
    color: var(--ap-navy);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .modulex-ap-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .modulex-ap-item {
    padding: 15px 12px 12px;
    border: 1px solid var(--ap-line);
    border-bottom: 3px solid var(--ap-amber);
    border-radius: 12px;
    background: var(--ap-soft);
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .modulex-ap-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(10, 46, 92, 0.12);
  }

  .modulex-ap-item.is-wide {
    grid-column: span 2;
  }

  .modulex-ap-val {
    display: block;
    white-space: nowrap;
    color: var(--ap-navy);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }

  .modulex-ap-item.is-text .modulex-ap-val {
    font-size: 22px;
    line-height: 1.2;
  }

  .modulex-ap-unit {
    display: block;
    margin-top: 7px;
    color: var(--ap-mute);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }

  
  .modulex-ap-cta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-top: 28px;
    padding: 28px;
    border: 1px solid var(--ap-line);
    border-left: 6px solid var(--ap-amber);
    border-radius: 16px;
    background: var(--ap-soft);
  }

  .modulex-ap-ctatitle {
    margin: 0 0 8px;
    color: var(--ap-navy);
    font-size: 21px;
    font-weight: 700;
  }

  .modulex-ap-ctainfo {
    margin: 0;
    color: var(--ap-mute);
    font-size: 14px;
    line-height: 1.75;
  }

  .modulex-ap-ctainfo strong {
    color: var(--ap-ink);
  }

  .modulex-ap-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .modulex-ap-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border: 2px solid transparent;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .modulex-ap-btn.is-primary {
    background: var(--ap-amber);
    color: var(--ap-ink);
  }

  .modulex-ap-btn.is-primary:hover {
    background: #e0961a;
  }

  .modulex-ap-btn.is-ghost {
    border-color: var(--ap-navy);
    color: var(--ap-navy);
  }

  .modulex-ap-btn.is-ghost:hover {
    background: var(--ap-navy);
    color: #fff;
  }

  .modulex-ap-btn .material-symbols-outlined {
    font-size: 20px;
  }

  .modulex-ap a:focus-visible {
    outline: 3px solid var(--ap-amber);
    outline-offset: 2px;
  }

  @media screen and (max-width: 1024px) {
    .modulex-ap {
      width: 100%;
      padding: 20px 15px 36px;
    }
  }

  @media screen and (max-width: 768px) {
    .modulex-ap-hero {
      padding: 30px 20px 0;
    }

    .modulex-ap-stats {
      grid-template-columns: repeat(2, 1fr);
      margin: 26px -20px 0;
    }

    .modulex-ap-stat {
      padding: 16px 20px;
    }

    .modulex-ap-stat:nth-child(2) {
      border-right: 0;
    }

    .modulex-ap-stat:nth-child(n + 3) {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .modulex-ap-group {
      padding: 18px;
    }

    .modulex-ap-items {
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .modulex-ap-cta {
      padding: 22px 18px;
    }
  }

  @media screen and (max-width: 560px) {
    .modulex-ap-ghead {
      flex-wrap: wrap;
    }

    .modulex-ap-ghead {
      align-items: flex-start;
    }

    .modulex-ap-ghead > div {
      flex: 1 1 calc(100% - 64px);
      min-width: 0;
    }

    .modulex-ap-count {
      order: 3;
      margin-left: 0;
    }

    .modulex-ap-btns,
    .modulex-ap-btn {
      width: 100%;
      justify-content: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .modulex-ap *,
    .modulex-ap *::before,
    .modulex-ap *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
